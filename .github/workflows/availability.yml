name: Availability

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
    inputs:
      url:
        description: Public production URL to verify
        required: false
        default: https://channieinifigge.uk
        type: string

permissions:
  contents: read

concurrency:
  group: availability-channieinifigge
  cancel-in-progress: true

jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      - name: Verify page and security headers
        env:
          TARGET_URL: ${{ inputs.url || 'https://channieinifigge.uk' }}
        run: |
          headers=$(mktemp)
          trap 'rm -f "$headers"' EXIT
          curl --ipv4 --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            --dump-header "$headers" --output /dev/null "$TARGET_URL"
          grep -qi '^strict-transport-security:' "$headers"
          grep -qi '^content-security-policy:' "$headers"
          grep -qi '^x-content-type-options: nosniff' "$headers"
