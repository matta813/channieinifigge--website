name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate nginx configuration
        run: docker run --rm -v "$PWD/default.conf:/etc/nginx/conf.d/default.conf:ro" nginx:stable-alpine nginx -t
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Check commit messages
        if: github.event_name == 'pull_request'
        run: >-
          npx --yes
          -p @commitlint/cli@21.2.1
          -p @commitlint/config-conventional@21.2.0
          commitlint
          --from "${{ github.event.pull_request.base.sha }}"
          --to "${{ github.event.pull_request.head.sha }}"

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          npx --yes
          -p semantic-release@24.2.9
          -p @semantic-release/changelog@6.0.3
          -p @semantic-release/exec@7.1.0
          -p @semantic-release/git@10.0.1
          -p @semantic-release/github@11.0.6
          -p conventional-changelog-conventionalcommits@10.2.1
          semantic-release
      - id: version
        run: |
          if [ -f release.env ]; then
            . ./release.env
            echo "value=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    if: needs.release.outputs.version != ''
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.release.outputs.version }}
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
