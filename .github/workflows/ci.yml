name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build and validate nginx image
        run: |
          docker build --tag channieinifigge-website:test .
          docker run --rm channieinifigge-website:test nginx -t
      - name: Smoke-test container and security headers
        run: |
          container_id=$(docker run --detach --publish 127.0.0.1:8088:8080 channieinifigge-website:test)
          trap 'docker rm --force "$container_id"' EXIT
          for _ in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:8088/ >/dev/null; then
              break
            fi
            sleep 1
          done
          headers=$(curl --fail --silent --head http://127.0.0.1:8088/)
          grep -qi '^Content-Security-Policy:' <<<"$headers"
          grep -qi '^X-Content-Type-Options: nosniff' <<<"$headers"
      - name: Check commit messages
        if: github.event_name == 'pull_request'
        run: >-
          npm run commitlint --
          --from "${{ github.event.pull_request.base.sha }}"
          --to "${{ github.event.pull_request.head.sha }}"

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm exec --yes \
            --package=semantic-release@25.0.9 \
            --package=@semantic-release/changelog@7.0.0 \
            --package=@semantic-release/exec@7.1.0 \
            --package=@semantic-release/git@11.0.1 \
            --package=@semantic-release/github@12.0.9 \
            --package=conventional-changelog-conventionalcommits@10.3.0 \
            -- semantic-release
      - id: version
        run: |
          if [ -f release.env ]; then
            . ./release.env
            echo "value=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    if: needs.release.outputs.version != ''
    needs: release
    runs-on: ubuntu-latest
    environment: production
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build image for security scan
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          provenance: false
          sbom: false
          tags: local/channieinifigge-website:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/channieinifigge-website:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.release.outputs.version }}
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
      - name: Attest published image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
