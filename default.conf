server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.youtube.com; style-src 'self'; frame-src https://www.youtube-nocookie.com; img-src 'self' https://i.ytimg.com data:; connect-src 'self' https://www.youtube.com; base-uri 'self'; frame-ancestors 'self'; object-src 'none'; form-action 'none';" always;

    location = /favicon.ico {
        alias /usr/share/nginx/html/favicon.svg;
        types { }
        default_type image/svg+xml;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|svg|txt)$ {
        expires 1h;
        try_files $uri =404;
    }
}
