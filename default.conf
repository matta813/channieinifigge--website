server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/xml image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.youtube.com; style-src 'self'; frame-src https://www.youtube-nocookie.com; img-src 'self' https://i.ytimg.com data:; connect-src 'self' https://www.youtube.com; base-uri 'self'; frame-ancestors 'self'; object-src 'none'; form-action 'none';" always;

    location = /favicon.ico {
        alias /usr/share/nginx/html/favicon.svg;
        types { }
        default_type image/svg+xml;
    }

    # Umami is proxied first-party so content blockers do not drop it
    location = /a/script.js {
        proxy_pass https://umami.scruzzi.com/script.js;
        proxy_ssl_server_name on;
        proxy_hide_header Content-Security-Policy;
    }

    location = /a/api/send {
        proxy_pass https://umami.scruzzi.com/api/send;
        proxy_ssl_server_name on;
        proxy_hide_header Content-Security-Policy;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|svg|png|txt|xml)$ {
        expires 1h;
        try_files $uri =404;
    }
}
